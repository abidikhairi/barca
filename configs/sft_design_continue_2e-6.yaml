# Continue SFT: protein design from Mol-Instructions, full fine-tune (fp32) from checkpoint-3000.
#
# Start: outputs/barca-0.8b-sft-design/checkpoint-3000 (step 3000 of the 2e-4 run).
# Data:  /home/kabidi/workspace/datasets/barca/mol-instruct, pre-tokenized chat conversations
#        (scripts/data/prepare_mol_instruct_design.py). 190,554 train rows and 2,000 validation
#        rows held out by protein accession (the extra *_of-00004.arrow shards are stale and not
#        referenced by state.json).
# Loss:  on the whole conversation (question and answer). The dataset has no `labels` column and
#        the collator builds labels from input_ids, so the prompt is NOT masked.
#
# LR: cosine to 0, peak 2e-6, 3% warmup (44 steps). 1 epoch x 1,489 = 1,489 optimizer steps
#   (190,554 / 128 per epoch).
#
# Batch: 4 x 32 = 128 samples/step. group_by_length is on (~60 s/step on an idle GB10).
#
# Smoke test first:
#   python -m barca.training --config configs/sft_design_continue_2e-6.yaml --no_wandb --max_steps 2
#
#   python -m barca.training --config configs/sft_design_continue_2e-6.yaml

run:
  name: barca-0.8b-sft-design-cont-2e-6
  output_dir: outputs/barca-0.8b-sft-design-cont-2e-6
  seed: 42
  description: Continue full FT (fp32) of SFT-design checkpoint-3000 on Mol-Instructions protein design for 1 epoch at lr 2e-6.

data:
  # Split-root layout: <path>/{train,validation} are save_to_disk datasets.
  path: /home/kabidi/workspace/datasets/barca/mol-instruct
  train_split: train
  eval_split: validation
  test_split: null
  text_column: text
  # Not applied to the pre-tokenized splits.
  max_seq_length: 2048
  packing: false
  packing_add_eos: true
  tokenized: null
  shuffle_samples: true
  max_train_samples: null
  max_eval_samples: null
  eval_fraction: 0.0
  test_fraction: 0.0
  num_proc: 8

tokenizer:
  name_or_path: outputs/barca-0.8b-sft-design/checkpoint-3000
  trust_remote_code: true
  use_fast: true

model:
  name_or_path: outputs/barca-0.8b-sft-design/checkpoint-3000
  trust_remote_code: true
  dtype: float32
  attn_implementation: sdpa
  gradient_checkpointing: true

peft:
  enabled: false

training:
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 32
  learning_rate: 2.0e-6
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  weight_decay: 0.01
  num_train_epochs: 1
  max_steps: -1
  logging_steps: 10
  # Evals at 500 and 1,000, plus the final model. save_steps must equal eval_steps.
  eval_strategy: steps
  eval_steps: 500
  save_strategy: steps
  save_steps: 500
  bf16: false
  fp16: false
  optim: adamw_torch
  gradient_checkpointing: true
  gradient_checkpointing_kwargs:
    use_reentrant: false
  dataloader_num_workers: 4
  group_by_length: true
  report_to: [wandb]

checkpointing:
  top_k: 3
  metric: eval_loss
  greater_is_better: false
  keep_last: false

wandb:
  enabled: true
  project: Barca
  entity: null
  tags: [full-finetune, fp32, sft, protein-design, mol-instructions, barca-0.8b, continue]
  notes: Continue full FT fp32 from SFT-design checkpoint-3000 on Mol-Instructions protein design (190,554 rows), cosine 2e-6, 1 epoch, loss on question and answer.
  log_config: true
  watch: "false"
