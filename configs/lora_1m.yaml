# Ready-to-run LoRA fine-tune: seed model, 1M-sample random subset, 2 epochs,
# constant LR 1e-4.
#
#   python -m barca.train --config configs/lora_1m.yaml
#
# Starts from the ORIGINAL seed model (khairi/barca-0.8b-base), not the
# embedding-only checkpoint. LoRA targets the self-attention + MLP projections
# (the linear_attn/GatedDeltaNet projections are excluded to keep the FLA fast
# path intact).

run:
  name: barca-0.8b-lora-1m
  output_dir: outputs/barca-0.8b-lora-1m
  seed: 42
  description: LoRA fine-tune of the seed model on a 1M-sample subset (2 epochs).

data:
  path: /home/kabidi/workspace/datasets/uniref50/barca_5m
  train_split: train
  eval_split: valid
  test_split: null
  text_column: text
  max_seq_length: 515
  packing: false
  packing_add_eos: true
  tokenized: null
  # Random 1M sample; eval on a 2k random subset.
  shuffle_samples: true
  max_train_samples: 1000000
  max_eval_samples: 2000
  eval_fraction: 0.0
  test_fraction: 0.0
  num_proc: 8

tokenizer:
  name_or_path: khairi/barca-0.8b-base
  trust_remote_code: true
  use_fast: true

model:
  name_or_path: khairi/barca-0.8b-base
  trust_remote_code: true
  dtype: bfloat16
  attn_implementation: sdpa
  gradient_checkpointing: true

peft:
  enabled: true
  method: lora
  r: 16
  alpha: 32
  dropout: 0.05
  # self-attention + MLP; excludes linear_attn (keeps the FLA fast kernel).
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  bias: none
  use_rslora: false

training:
  per_device_train_batch_size: 48
  per_device_eval_batch_size: 32
  gradient_accumulation_steps: 4
  # Constant LR 1e-4 (no warmup, no decay).
  learning_rate: 1.0e-4
  lr_scheduler_type: constant
  warmup_ratio: 0.0
  weight_decay: 0.01
  num_train_epochs: 2
  max_steps: -1
  logging_steps: 50
  eval_strategy: steps
  eval_steps: 500
  save_strategy: steps
  save_steps: 500
  bf16: true
  optim: adamw_torch
  gradient_checkpointing: true
  gradient_checkpointing_kwargs:
    use_reentrant: false
  dataloader_num_workers: 4
  report_to: [wandb]

checkpointing:
  top_k: 3
  metric: eval_loss
  greater_is_better: false
  keep_last: false

wandb:
  enabled: true
  project: Barca
  entity: null
  tags: [lora, protein, barca-0.8b, 1m, seed-init]
  notes: LoRA on a random 1M subset, 2 epochs, constant LR 1e-4, from the seed model.
  log_config: true
  watch: "false"
