# LoRA fine-tuning recipe for khairi/barca-0.8b-base.
# Run with:  python -m barca.train --config configs/lora.yaml

run:
  name: barca-0.8b-lora
  output_dir: outputs/barca-0.8b-lora
  seed: 42
  description: LoRA fine-tuning on protein sequences.

data:
  path: /home/kabidi/workspace/datasets/uniref50/barca_5m
  train_split: train
  eval_split: valid
  text_column: text
  max_seq_length: 515
  packing: false
  packing_add_eos: true
  tokenized: null
  eval_fraction: 0.0
  num_proc: 8

tokenizer:
  name_or_path: khairi/barca-0.8b-base
  trust_remote_code: true
  use_fast: true

model:
  name_or_path: khairi/barca-0.8b-base
  trust_remote_code: true
  dtype: bfloat16
  attn_implementation: sdpa
  gradient_checkpointing: true

peft:
  enabled: true
  method: lora
  r: 16
  alpha: 32
  dropout: 0.05
  # Qwen3.5 hybrid: self-attention + MLP + GatedDeltaNet (linear_attn) projections.
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
    - in_proj_qkv
    - in_proj_z
    - in_proj_b
    - in_proj_a
    - out_proj
  bias: none
  use_rslora: false

training:
  per_device_train_batch_size: 16
  per_device_eval_batch_size: 16
  gradient_accumulation_steps: 2
  learning_rate: 2.0e-4
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  weight_decay: 0.01
  num_train_epochs: 3
  logging_steps: 10
  eval_strategy: steps
  eval_steps: 200
  save_strategy: steps
  save_steps: 200
  bf16: true
  optim: adamw_torch
  gradient_checkpointing: true
  gradient_checkpointing_kwargs:
    use_reentrant: false
  dataloader_num_workers: 4
  report_to: [wandb]

checkpointing:
  top_k: 3
  metric: eval_loss
  greater_is_better: false
  keep_last: false

wandb:
  enabled: true
  project: Barca
  entity: null
  tags: [lora, protein, barca-0.8b]
  notes: LoRA fine-tune of barca-0.8b-base.
  log_config: true
  watch: "false"
