# GRPO recipe: continue the SFT-design checkpoint with format/reference/
# foldability/diversity/length rewards. The foldability reward calls a local
# ESMFold2 FastAPI service (scripts/serving/esmfold2_service.py).
#
# Run on the GPU server:
#   PYTHONPATH=src python scripts/training/train_grpo.py --config configs/grpo.yaml

run:
  name: barca-0.8b-grpo
  output_dir: outputs/barca-0.8b-grpo
  seed: 42

model:
  name_or_path: outputs/barca-0.8b-sft-design-cont-2e-6
  attn_implementation: sdpa

data:
  path: /home/kabidi/workspace/datasets/barca/mol-instruct
  train_split: train
  validation_split: validation
  num_prompts: 5000
  min_len: 30
  max_len: 512
  max_ref_len: null
  seed: 42
  cache_dir: /home/kabidi/workspace/datasets/barca/mol-instruct-grpo-5k
  reuse_cache: true

rewards:
  include_foldability: true
  format_weight: 0.10
  ref_f1_weight: 0.30
  foldability_weight: 0.35
  diversity_weight: 0.15
  length_weight: 0.10
  uniq5_target: 0.8
  require_zeta: true
  min_len: 30
  max_len: 512
  fold_service_url: http://127.0.0.1:8010
  # Calibration on 10 sequences: 1/20 vs 4/20 gave Spearman 1.0 and MAE 0.0075;
  # 4/10 and 2/10 collapse. Fold every 5 optimizer steps to keep the full run
  # tractable while retaining group-level foldability signal.
  fold_num_loops: 1
  fold_num_sampling_steps: 20
  fold_every_n_steps: 5
  fold_timeout_s: 1200

lora:
  r: 64
  alpha: 128
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

grpo:
  num_generations: 5
  temperature: 0.9
  top_p: 0.95
  top_k: 50
  repetition_penalty: 1.2
  max_completion_length: 700
  beta: 0.04
  learning_rate: 1.0e-6
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 5
  num_train_epochs: 1.0
  max_steps: -1
  bf16: true
  gradient_checkpointing: true
  logging_steps: 10
  save_strategy: steps
  save_steps: 100
  log_completions: false
  num_completions_to_print: 2
  multi_objective_aggregation: sum_then_normalize
  scale_rewards: group
  dataloader_num_workers: 0

wandb:
  enabled: true
  project: Barca
  entity: null
  tags: [grpo, protein-design, barca-0.8b]
  notes: GRPO continuation of barca-0.8b-sft-design-cont-2e-6 with foldability reward.
