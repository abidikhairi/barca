# Full fine-tuning recipe for khairi/barca-0.8b-base on a protein corpus.
# Run with:  python -m barca.train --config configs/full_ft.yaml
#
# The `training` section is forwarded to transformers.TrainingArguments.
# `checkpointing` is handled by barca: only the top_k best checkpoints (by
# eval_loss) are kept on disk. W&B receives metrics only (no checkpoint upload).

run:
  name: barca-0.8b-full-ft
  output_dir: outputs/barca-0.8b-full-ft
  seed: 42
  description: Full fine-tuning on protein sequences.

data:
  # Split-root layout: <path>/<split> is a save_to_disk dataset.
  path: /home/kabidi/workspace/datasets/uniref50/barca
  train_split: train
  eval_split: valid
  test_split: null
  # Raw data only; ignored when the dataset is pre-tokenized.
  text_column: sequence
  max_seq_length: 512
  packing: false
  packing_add_eos: true
  # Dataset is pre-packed and pre-tokenized (has input_ids + attention_mask).
  tokenized: true
  # Only used when the source has no eval/test split.
  eval_fraction: 0.0
  test_fraction: 0.0
  num_proc: 8
  max_train_samples: null
  max_eval_samples: null

tokenizer:
  name_or_path: khairi/barca-0.8b-base
  trust_remote_code: true
  use_fast: true
  model_max_length: null
  pad_token: null
  eos_token: null
  bos_token: null

model:
  name_or_path: khairi/barca-0.8b-base
  trust_remote_code: true
  dtype: bfloat16
  # flash_attention_2 | sdpa | eager | null
  attn_implementation: flash_attention_2
  gradient_checkpointing: true

peft:
  enabled: false
  method: lora

training:
  per_device_train_batch_size: 8
  per_device_eval_batch_size: 8
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-5
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  weight_decay: 0.01
  num_train_epochs: 3
  max_steps: -1
  logging_steps: 10
  eval_strategy: steps
  eval_steps: 200
  save_strategy: steps
  save_steps: 200
  bf16: true
  optim: adamw_torch
  gradient_checkpointing: true
  gradient_checkpointing_kwargs:
    use_reentrant: false
  dataloader_num_workers: 4
  group_by_length: true
  report_to: [wandb]

checkpointing:
  top_k: 3
  metric: eval_loss
  greater_is_better: false
  keep_last: false

wandb:
  enabled: true
  project: barca-protein
  entity: null
  tags: [full-finetune, protein, barca-0.8b]
  notes: Full fine-tune of barca-0.8b-base.
  log_config: true
  watch: "false"
