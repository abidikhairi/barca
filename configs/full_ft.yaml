# Full fine-tuning recipe for khairi/barca-0.8b-base on a protein corpus.
# Run with:  python -m barca.train --config configs/full_ft.yaml
#
# "Full fine-tuning" here means no parameter-efficient adapters, but the model
# is still frozen except for the new protein-token embeddings (see `model`).
# The `training` section is forwarded to transformers.TrainingArguments.
# `checkpointing` keeps only the top_k best checkpoints (by eval_loss).

run:
  name: barca-0.8b-full-ft
  output_dir: outputs/barca-0.8b-full-ft
  seed: 42
  description: Full fine-tuning of the new protein-token embeddings on UniRef50.

data:
  # Split-root layout: <path>/{train,valid} are save_to_disk datasets.
  path: /home/kabidi/workspace/datasets/uniref50/barca_5m
  train_split: train
  eval_split: valid
  test_split: null
  # train is pre-packed (515 tokens); valid is raw text, tokenized on the fly.
  text_column: text
  max_seq_length: 515
  packing: false
  packing_add_eos: true
  # null => auto-detect per split (train tokenized, valid raw).
  tokenized: null
  eval_fraction: 0.0
  test_fraction: 0.0
  num_proc: 8
  max_train_samples: null
  max_eval_samples: null

tokenizer:
  name_or_path: khairi/barca-0.8b-base
  trust_remote_code: true
  use_fast: true
  model_max_length: null
  pad_token: null
  eos_token: null
  bos_token: null

model:
  name_or_path: khairi/barca-0.8b-base
  trust_remote_code: true
  dtype: bfloat16
  # flash_attention_2 | sdpa | eager | null
  # (use flash_attention_2 only if flash-attn is installed on the server)
  attn_implementation: sdpa
  gradient_checkpointing: true
  # Train ONLY the added protein-token embeddings; freeze the rest of the model.
  # Ids 248077..248098 are the 22 added tokens:
  #   the 20 zeta-prefixed amino acids (ζA..ζY), <protein> and </protein>.
  # (Equivalently: trainable_tokens: ["<protein>", "</protein>", "ζA", ...])
  trainable_token_range: [248077, 248098]

peft:
  enabled: false
  method: lora

training:
  per_device_train_batch_size: 48
  per_device_eval_batch_size: 32
  # Effective batch = 48 * 4 = 192. bs48 is the largest that fits; bs64+ OOM.
  # Gradient checkpointing is mandatory at bs48.
  gradient_accumulation_steps: 4
  learning_rate: 3.0e-4
  lr_scheduler_type: cosine
  warmup_ratio: 0.05
  weight_decay: 0.1
  num_train_epochs: 1
  max_steps: -1
  logging_steps: 50
  eval_strategy: steps
  eval_steps: 500
  save_strategy: steps
  save_steps: 500
  bf16: true
  optim: adamw_torch
  gradient_checkpointing: true
  gradient_checkpointing_kwargs:
    use_reentrant: false
  dataloader_num_workers: 4
  group_by_length: false
  report_to: [wandb]

checkpointing:
  top_k: 3
  metric: eval_loss
  greater_is_better: false
  keep_last: false

wandb:
  enabled: true
  project: Barca
  entity: null
  tags: [full-finetune, protein, barca-0.8b, uniref50]
  notes: Full fine-tune of the new protein-token embeddings on UniRef50.
  log_config: true
  watch: "false"
